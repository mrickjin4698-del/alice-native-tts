[package]
name = "alice-native-tts"
version = "0.1.0"
edition = "2021"
description = "Standalone local GPT-SoVITS synthesis and streaming"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mrickjin4698-del/alice-native-tts"
keywords = ["tts", "gpt-sovits", "onnx", "speech"]
categories = ["multimedia::audio"]

[workspace]
resolver = "2"

[features]
raw-checkpoint = ["dep:half", "dep:prost", "dep:repugnant-pickle", "dep:zip", "ort/half"]
pack-tools = ["dep:clap", "dep:ndarray", "dep:ndarray-npy", "dep:sha2"]
server = ["dep:axum", "dep:tokio"]
r0-profiling = []
r1-gpt-step-v2 = []
r1-r8-preview = []
r1-r9-bounded-preview = []
r2-0-first-audible = ["r1-cuda-ep"]
r1-cuda-ep = ["ort/cuda", "ort/load-dynamic"]
r1-tensorrt-ep = ["r1-cuda-ep", "ort/tensorrt"]
r2-trt-native = ["ort/load-dynamic"]
r2-trt-native-cuda-vits = ["r2-trt-native", "r1-cuda-ep"]

[dependencies]
half = { version = "2", optional = true }
prost = { version = "0.14", optional = true }
repugnant-pickle = { version = "0.0.1", optional = true }
zip = { version = "6", default-features = false, features = ["deflate"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
ndarray = { version = "0.17", optional = true }
ndarray-npy = { version = "0.10", default-features = false, features = ["compressed_npz"], optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }
base64 = "0.22"
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
thiserror = "2"
regex = "1"

[build-dependencies]
cc = "1.4"

[[example]]
name = "r0_profile"
required-features = ["r0-profiling"]

[[example]]
name = "r1_3_profile"
required-features = ["r0-profiling", "r1-cuda-ep"]

[[example]]
name = "r1_4_profile"
required-features = ["r0-profiling", "r1-cuda-ep"]

[[example]]
name = "r1_5_profile"
required-features = ["r0-profiling", "r1-cuda-ep"]

[[example]]
name = "r1_5_trt_smoke"
required-features = ["r1-tensorrt-ep"]

[[example]]
name = "r1_6_kernel_trace"
required-features = ["r1-cuda-ep"]

[[example]]
name = "r1_7_copy_trace"
required-features = ["r1-cuda-ep"]

[[example]]
name = "r1_8_preview_refill"
required-features = ["r1-cuda-ep", "r1-r8-preview"]

[[example]]
name = "r1_9_bounded_preview"
required-features = ["r1-cuda-ep", "r1-r8-preview", "r1-r9-bounded-preview"]

[[example]]
name = "r2_0_first_audible"
required-features = ["r2-0-first-audible"]

[[example]]
name = "r2_1_trt_native_cancel"
required-features = ["r2-trt-native"]

[[example]]
name = "cuda_smoke"
required-features = ["r1-cuda-ep"]

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
