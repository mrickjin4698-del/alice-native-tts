[package]
name = "alice-native-tts"
version = "0.1.0"
edition = "2021"
description = "Local GPT-SoVITS v2Pro ONNX inference in Rust"
license = "Apache-2.0"
readme = "README.md"
keywords = ["tts", "gpt-sovits", "onnx", "speech"]
categories = ["multimedia::audio"]

[workspace]
resolver = "2"

[features]
r0-profiling = []
r1-gpt-step-v2 = []
r1-cuda-ep = ["ort/cuda", "ort/load-dynamic"]
r1-tensorrt-ep = ["r1-cuda-ep", "ort/tensorrt"]

[dependencies]
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
thiserror = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "r0_profile"
required-features = ["r0-profiling"]

[[example]]
name = "r1_3_profile"
required-features = ["r0-profiling", "r1-cuda-ep"]

[[example]]
name = "r1_4_profile"
required-features = ["r0-profiling", "r1-cuda-ep"]

[[example]]
name = "cuda_smoke"
required-features = ["r1-cuda-ep"]

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
